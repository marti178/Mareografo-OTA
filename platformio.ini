; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:esp-wrover-kit]
platform = espressif32@8.0.0
board = esp-wrover-kit
framework = arduino

; FIRMWARE_VERSION sale de version.txt
extra_scripts = pre:scripts/version.py

board_build.partitions = partitions/partitions_ota.csv

monitor_speed = 115200
monitor_port = COM3

build_flags =
	; Buffer RX de TinyGSM por socket. Por defecto es 64 B: cada 64 B de descarga
	; costaban 3 comandos AT (CARECV + CARECV? + CASTATE?). 1024 = ~16x menos
	; viajes al modem (maximo del SIM7070 por CARECV: 1459).
	-DTINY_GSM_RX_BUFFER=1024

lib_deps =
	lowpowerlab/BMP180@0.0.0-alpha+sha.efac46bd8d
	knolleary/PubSubClient@2.8.0
	vshymanskyy/TinyGSM@0.12.0
	bblanchon/ArduinoJson@7.4.3
	arduino-libraries/ArduinoHttpClient@0.6.2
